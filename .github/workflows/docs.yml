name: Publish Docs + App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build your Nx app
      - name: Build Nx App
        run: pnpm nx build app

      # Generate docs
      - name: Generate Docs
        run: pnpm run docs

      # Prepare combined output folder
      - name: Prepare Pages Artifact
        run: |
          rm -rf pages-artifact
          mkdir -p pages-artifact/docs
          mkdir -p pages-artifact/docs/sample
          # Copy generated docs
          cp -R dist/docs/* pages-artifact/docs/
          # Copy Nx app build
          cp -R apps/app/dist/* pages-artifact/docs/sample/

      # Upload everything as artifact for Pages
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4